<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Euskadi · Mapa digitala</title>
  <meta name="description" content="Mapa digital de Euskadi con todas las calles. Euskadiko mapa digitala, kale guztiekin.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181d'/%3E%3Cpath d='M7 20l6-9 5 6 3-3 4 6z' fill='%23e8c987'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg: #16181d;
      --panel: rgba(18, 20, 25, 0.86);
      --line: rgba(232, 201, 135, 0.22);
      --text: #e7e2d6;
      --muted: #8f96a3;
      --accent: #e8c987;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }

    .panel {
      position: absolute; top: 16px; left: 16px; z-index: 2; width: 300px; max-width: calc(100% - 32px);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 16px 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
    .sub { margin: 2px 0 12px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
    .row { display: flex; gap: 6px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; width: 100%; }

    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: rgba(232, 201, 135, 0.14); color: var(--accent); }

    input[type="search"] {
      width: 100%; background: rgba(255, 255, 255, 0.04); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); }

    label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 13px; width: 100%; }
    label.chk input { accent-color: var(--accent); }

    .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .links a { color: var(--muted); font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
    .links a:hover { color: var(--accent); border-color: var(--accent); }

    details summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; user-select: none; }
    details summary::before { content: "▸ "; }
    details[open] summary::before { content: "▾ "; }

    .maplibregl-popup-content { background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(8px); }
    .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
    .maplibregl-popup-content b { color: var(--accent); }
    .maplibregl-popup-content small { color: var(--muted); }
    .maplibregl-ctrl-attrib { background: rgba(18, 20, 25, 0.7) !important; color: var(--muted); }
    .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
    .maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--line); }
    .maplibregl-ctrl-group button + button { border-top-color: var(--line) !important; }
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(0.85); }

    @media (max-width: 600px) {
      .panel { top: 10px; left: 10px; right: 58px; width: auto; padding: 12px; }
    }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Mapa"></div>

  <aside class="panel">
    <h1>Euskadi</h1>
    <p class="sub" data-i18n="sub">Mapa digitala · Mapa digital</p>

    <input id="buscar" type="search" list="lista-municipios" autocomplete="off" data-i18n-ph="buscar" placeholder="Udalerria bilatu…">
    <datalist id="lista-municipios"></datalist>

    <details id="opciones" open>
      <summary data-i18n="opciones">Aukerak</summary>

      <div class="row">
        <span class="label" data-i18n="idioma">Hizkuntza</span>
        <div class="seg" id="idioma">
          <button data-lang="eu">EU</button>
          <button data-lang="es">ES</button>
          <button data-lang="ofi" aria-pressed="true">EU / ES</button>
        </div>
      </div>

      <div class="row">
        <span class="label" data-i18n="capas">Geruzak</span>
        <label class="chk"><input type="checkbox" data-capas="mascara" checked> <span data-i18n="c_mascara">Kanpoaldea ilundu</span></label>
        <label class="chk"><input type="checkbox" data-capas="provincias-linea" checked> <span data-i18n="c_prov">Lurraldeak</span></label>
        <label class="chk"><input type="checkbox" data-capas="municipios-linea" checked> <span data-i18n="c_muni">Udalerriak</span></label>
        <label class="chk"><input type="checkbox" data-capas="edificios" checked> <span data-i18n="c_edif">Eraikinak</span></label>
      </div>

      <div class="row">
        <span class="label">GeoJSON</span>
        <div class="links">
          <a href="data/euskadi.geojson" download>euskadi</a>
          <a href="data/provincias.geojson" download>provincias</a>
          <a href="data/municipios.geojson" download>municipios</a>
          <a href="data/mascara.geojson" download>mascara</a>
          <a href="estilo/euskadi-oscuro.json" download data-i18n="estilo">estiloa</a>
        </div>
      </div>
    </details>
  </aside>

  <script>
    const TXT = {
      eu: { sub: "Mapa digitala · kale guztiak", buscar: "Udalerria bilatu…", opciones: "Aukerak", idioma: "Hizkuntza", capas: "Geruzak",
            c_mascara: "Kanpoaldea ilundu", c_prov: "Lurraldeak", c_muni: "Udalerriak", c_edif: "Eraikinak", estilo: "estiloa",
            pob: "biztanle", prov: "Lurraldea" },
      es: { sub: "Mapa digital · todas las calles", buscar: "Buscar municipio…", opciones: "Opciones", idioma: "Idioma", capas: "Capas",
            c_mascara: "Oscurecer el exterior", c_prov: "Provincias", c_muni: "Municipios", c_edif: "Edificios", estilo: "estilo",
            pob: "habitantes", prov: "Provincia" },
    };
    TXT.ofi = { ...TXT.eu, sub: "Mapa digitala · Mapa digital" };

    // Expresión de nombre según idioma. "ofi" = nombre oficial de OSM (a menudo bilingüe).
    const NOMBRE = {
      eu: ["coalesce", ["get", "name:eu"], ["get", "name"], ""],
      es: ["coalesce", ["get", "name:es"], ["get", "name"], ""],
      ofi: ["coalesce", ["get", "name"], ""],
    };

    let lang = "ofi";
    try { lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("euskadi-lang") || "ofi"; } catch (e) {}
    if (!NOMBRE[lang]) lang = "ofi";

    const abs = (p) => new URL(p, location.href).href;

    async function cargarEstilo() {
      const estilo = await (await fetch("estilo/euskadi-oscuro.json")).json();
      for (const src of Object.values(estilo.sources)) {
        if (src.type === "geojson" && typeof src.data === "string") src.data = abs(src.data);
      }
      return estilo;
    }

    function aplicarIdioma(map) {
      for (const capa of map.getStyle().layers) {
        if (!capa.metadata || !capa.metadata.etiqueta) continue;
        if (capa.id === "cumbres") {
          map.setLayoutProperty(capa.id, "text-field",
            ["concat", "▲ ", NOMBRE[lang], "\n", ["to-string", ["get", "ele"]], " m"]);
        } else {
          map.setLayoutProperty(capa.id, "text-field", NOMBRE[lang]);
        }
      }
      const t = TXT[lang];
      document.documentElement.lang = lang === "es" ? "es" : "eu";
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t[el.dataset.i18nPh]; });
      document.querySelectorAll("#idioma button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    }

    function nombreMunicipio(p) {
      if (lang === "eu") return p.izena_eu || p.nombre;
      if (lang === "es") return p.nombre_es || p.nombre;
      return p.nombre;
    }

    (async () => {
      const estilo = await cargarEstilo();
      const mascara = await (await fetch("data/mascara.geojson")).json();
      const [w, s, e, n] = mascara.features[0].properties.bbox;

      const map = new maplibregl.Map({
        container: "map",
        style: estilo,
        center: estilo.center,
        zoom: estilo.zoom,
        minZoom: 7,
        maxZoom: 19,
        maxBounds: [[w, s], [e, n]],
        hash: true,
        attributionControl: { compact: false },
      });
      window.map = map;
      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
      map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), "top-right");
      map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");

      map.on("load", async () => {
        aplicarIdioma(map);

        // Buscador de municipios
        const munis = await (await fetch("data/municipios.geojson")).json();
        const indice = new Map();
        const lista = document.getElementById("lista-municipios");
        for (const f of munis.features) {
          const p = f.properties;
          for (const nom of new Set([p.nombre, p.izena_eu, p.nombre_es])) {
            if (!nom || indice.has(nom.toLowerCase())) continue;
            indice.set(nom.toLowerCase(), f);
            const o = document.createElement("option");
            o.value = nom;
            lista.appendChild(o);
          }
        }
        const buscar = document.getElementById("buscar");
        const irA = () => {
          const f = indice.get(buscar.value.trim().toLowerCase());
          if (!f) return;
          const b = new maplibregl.LngLatBounds();
          const recorrer = (c) => (typeof c[0] === "number" ? b.extend(c) : c.forEach(recorrer));
          recorrer(f.geometry.coordinates);
          map.fitBounds(b, { padding: 60, duration: 1600 });
          map.setFilter("municipio-resaltado", ["==", ["get", "osm_id"], f.properties.osm_id]);
          buscar.blur();
        };
        buscar.addEventListener("change", irA);
        buscar.addEventListener("keydown", (ev) => { if (ev.key === "Enter") irA(); });

        // Relleno invisible para poder consultar municipios al hacer clic
        map.addLayer({ id: "municipios-clic", type: "fill", source: "municipios", minzoom: 8,
          paint: { "fill-color": "#000", "fill-opacity": 0 } }, "municipios-linea");
        map.addLayer({ id: "municipio-resaltado", type: "line", source: "municipios",
          filter: ["==", ["get", "osm_id"], -1],
          paint: { "line-color": "#e8c987", "line-width": 1.6, "line-opacity": 0.8 } }, "mascara");

        map.on("click", "municipios-clic", (ev) => {
          if (map.getZoom() >= 15) return;
          const p = ev.features[0].properties;
          map.setFilter("municipio-resaltado", ["==", ["get", "osm_id"], p.osm_id]);
          const t = TXT[lang];
          const pob = p.poblacion ? `<br><small>${Number(p.poblacion).toLocaleString(lang === "es" ? "es" : "eu")} ${t.pob}</small>` : "";
          const ine = p.ine ? `<br><small>INE ${p.ine}</small>` : "";
          new maplibregl.Popup({ closeButton: false, maxWidth: "260px" })
            .setLngLat(ev.lngLat)
            .setHTML(`<b>${nombreMunicipio(p)}</b><br><small>${t.prov}: ${p.provincia || "—"}</small>${pob}${ine}`)
            .addTo(map);
        });
        map.on("mouseenter", "municipios-clic", () => { if (map.getZoom() < 15) map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", "municipios-clic", () => { map.getCanvas().style.cursor = ""; });
      });

      document.querySelectorAll("#idioma button").forEach((b) =>
        b.addEventListener("click", () => {
          lang = b.dataset.lang;
          try { localStorage.setItem("euskadi-lang", lang); } catch (e) {}
          if (map.isStyleLoaded()) aplicarIdioma(map);
        }));

      document.querySelectorAll("[data-capas]").forEach((chk) =>
        chk.addEventListener("change", () => {
          for (const id of chk.dataset.capas.split(",")) {
            if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", chk.checked ? "visible" : "none");
          }
        }));

      if (window.matchMedia("(max-width: 600px)").matches) document.getElementById("opciones").open = false;
    })();
  </script>
</body>
</html>
